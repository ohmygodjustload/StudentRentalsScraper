# Default pipeline settings (CLI args override these)
output.dir=output
scraper.minId=0
scraper.maxId=900
scraper.delayMs=1000

# Campus coordinates (UW-La Crosse)
campus.lat=43.81610373619651
campus.lng=-91.2311481387267

# TravelTime API defaults
traveltime.maxSeconds=1800
traveltime.arrivalHour=8

# Deal scoring thresholds. Each component scores linearly between its "full" and "zero" value.
# Price is pricePerPerson in dollars; travel times are minutes; distance is miles.
scoring.price.fullAt=450
scoring.price.zeroAt=750
scoring.walk.fullMinutes=8
scoring.walk.zeroMinutes=25
scoring.bike.fullMinutes=3
scoring.bike.zeroMinutes=10
scoring.distance.fullMiles=0.35
scoring.distance.zeroMiles=1.5
